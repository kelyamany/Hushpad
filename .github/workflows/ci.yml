name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Run HushpadKit tests
        run: swift test --package-path HushpadKit

  build:
    name: Build ${{ matrix.name }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            scheme: Hushpad
            destination: platform=macOS
          - name: iOS
            scheme: Hushpad
            destination: generic/platform=iOS Simulator
          - name: watchOS
            scheme: HushpadWatch
            destination: generic/platform=watchOS Simulator
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: >
          xcodebuild -project Hushpad.xcodeproj -scheme "${{ matrix.scheme }}"
          -destination "${{ matrix.destination }}" CODE_SIGNING_ALLOWED=NO build -quiet
