name: Feature idea
description: Suggest something LocalScribe could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or situation, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: checkboxes
    id: rules
    attributes:
      label: Ground rules
      options:
        - label: This keeps audio on the device and adds no cloud feature that's on by default (see CONTRIBUTING.md).
          required: true
